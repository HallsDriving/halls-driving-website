<div class="panel" style="margin-top:28px">
  <div class="panel-head">REGISTER FOR A CLASS</div>

  <div class="panel-body">
    <form
      id="defensive-form"
      name="defensive-driving"
      method="POST"
      data-netlify="true"
    >
      <input type="hidden" name="form-name" value="defensive-driving">

      <div class="form-grid">
        <div class="field">
          <label for="first-name">First Name</label>
          <input id="first-name" name="first_name" required>
        </div>

        <div class="field">
          <label for="last-name">Last Name</label>
          <input id="last-name" name="last_name" required>
        </div>

        <div class="field">
          <label for="phone">Phone Number</label>
          <input id="phone" name="phone" type="tel" required>
        </div>

        <div class="field">
          <label for="email">Email Address</label>
          <input id="email" name="email" type="email" required>
        </div>

        <div class="field">
          <label for="contact-method">Preferred Contact Method</label>
          <select id="contact-method" name="contact_method">
            <option value="Phone">Phone</option>
            <option value="Email">Email</option>
          </select>
        </div>

        <div class="field">
          <label for="class-date">Selected Class Date</label>
          <input id="class-date" name="class_date" type="date" required>
        </div>

        <div class="field full">
          <label for="comments">Comments or Questions</label>
          <textarea id="comments" name="comments" rows="4"></textarea>
        </div>

        <div class="field full">
          <button class="btn" type="submit">Submit Registration</button>
        </div>
      </div>
    </form>

    <div id="defensive-confirmation" hidden>
      Thank you. Your registration was submitted.
    </div>
  </div>
</div>
